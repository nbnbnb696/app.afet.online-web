name: monitoring

on:
  workflow_dispatch: {}

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-apet
          cluster-name: aks-apet
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Add monitoring Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: kubectl apply -f helm/monitoring/namespace.yaml

      - name: Deploy Prometheus
        run: |
          helm upgrade --install prometheus prometheus-community/prometheus \
            -n monitoring -f helm/monitoring/prometheus-values.yaml \
            --wait

      - name: Deploy Grafana
        run: |
          cat <<EOF > /tmp/grafana-smtp-secret.yaml
          grafana.ini:
            smtp:
              password: "${{ secrets.GRAFANA_SMTP_PASSWORD }}"
          EOF
          helm upgrade --install grafana grafana/grafana \
            -n monitoring -f helm/monitoring/grafana-values.yaml \
            -f /tmp/grafana-smtp-secret.yaml \
            --set adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --wait
          rm -f /tmp/grafana-smtp-secret.yaml
