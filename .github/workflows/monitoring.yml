name: monitoring

on:
  workflow_dispatch: {}

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-apet
          cluster-name: aks-apet
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Add monitoring Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: kubectl apply -f helm/monitoring/namespace.yaml

      - name: Deploy Blackbox Exporter
        run: |
          helm upgrade --install prometheus-blackbox-exporter prometheus-community/prometheus-blackbox-exporter \
            -n monitoring -f helm/monitoring/blackbox-values.yaml \
            --wait

      - name: Deploy Prometheus
        run: |
          helm upgrade --install prometheus prometheus-community/prometheus \
            -n monitoring -f helm/monitoring/prometheus-values.yaml \
            --wait

      - name: Create Grafana SMTP secret
        run: |
          kubectl create secret generic grafana-smtp-secret \
            --from-literal=GF_SMTP_PASSWORD='${{ secrets.GRAFANA_SMTP_PASSWORD }}' \
            -n monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Grafana
        run: |
          helm upgrade --install grafana grafana/grafana \
            -n monitoring -f helm/monitoring/grafana-values.yaml \
            --set adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --wait
