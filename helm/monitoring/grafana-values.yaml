# Values for grafana/grafana Helm chart
# Goal: single Grafana pod, persistent dashboards, Prometheus pre-wired
# as a datasource, exposed via existing nginx Ingress + cert-manager TLS.
#
# NOTE: admin password is intentionally NOT set here (avoid committing
# secrets to a file). Pass it at install time — see install command below.

replicas: 1

persistence:
  enabled: true
  storageClassName: "managed-csi"   # AKS built-in CSI class = Standard SSD (LRS)
  size: 2Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Auto-provision the Prometheus datasource so it's there on first login
# instead of clicking through the UI. Assumes the Prometheus Helm release
# is named "prometheus" in the "monitoring" namespace (service = prometheus-server).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

# SMTP for Grafana alert notification emails. The chart refuses (via its
# assertNoLeakedSecrets check) to have a literal password anywhere in values,
# so the password uses Grafana's own $__env{} variable-expansion syntax,
# resolved at runtime from a real env var. That env var is populated from a
# Kubernetes Secret named "grafana-smtp-secret" (created by monitoring.yml
# from the GRAFANA_SMTP_PASSWORD GitHub secret, never committed here).
envFromSecret: grafana-smtp-secret

grafana.ini:
  smtp:
    enabled: true
    host: smtp.gmail.com:587
    user: vbvbvb696@gmail.com
    password: '$__env{GF_SMTP_PASSWORD}'
    from_address: vbvbvb696@gmail.com
    from_name: Grafana
    startTLS_policy: MandatoryStartTLS

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - grafana.afet.online
  path: /
  pathType: Prefix
  tls:
    - secretName: grafana-afet-tls
      hosts:
        - grafana.afet.online
